# File: .github/workflows/prod.yml
# Mục đích: Kiểm tra kỹ hơn khi merge vào production
# Chạy được NGAY, không cần VPS

name: 🚀 Production Branch CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải code
        uses: actions/checkout@v4

      - name: ⚙️ Cài .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 📦 Restore packages
        run: dotnet restore RecruitAI-API.sln

      - name: 🔨 Build
        run: dotnet build RecruitAI-API.sln --configuration Release --no-restore

      - name: 🧪 Chạy Unit Tests
        run: |
          dotnet test tests/RecruitAI.UnitTests \
            --configuration Release \
            --logger "trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: 🧪 Chạy Integration Tests
        run: |
          dotnet test tests/RecruitAI.IntegrationTests \
            --configuration Release \
            --logger "trx" \
            --results-directory ./TestResults

      - name: 📊 Upload kết quả test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-test-results
          path: ./TestResults

      - name: 📈 Check code coverage
        run: |
          echo "📊 Code coverage report:"
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./coveragereport -reporttypes:Html
          echo "✅ Coverage report generated"

  security:
    name: 🔒 Kiểm tra bảo mật
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Tải code
        uses: actions/checkout@v4

      - name: 🔍 Quét lỗ hổng bảo mật
        run: |
          dotnet list package --vulnerable --include-transitive

      - name: ✅ Thông báo
        run: echo "✅ Security check passed"

  docker:
    name: 🐳 Build Docker image
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: github.event_name == 'push' # Chỉ chạy khi push, không chạy khi pull_request

    steps:
      - name: 📥 Tải code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -t recruitai-api:latest .
          echo "✅ Docker image built successfully"

      - name: 💾 Lưu image (tùy chọn)
        run: |
          docker save recruitai-api:latest -o recruitai-api.tar

      - name: 📤 Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: recruitai-api.tar

  summary:
    name: 📋 Tổng kết
    runs-on: ubuntu-latest
    needs: [build-and-test, security, docker]
    if: always()

    steps:
      - name: ✅ Tạo báo cáo
        run: |
          echo "## 🚀 Production Branch CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Sẵn sàng để deploy!" >> $GITHUB_STEP_SUMMARY
