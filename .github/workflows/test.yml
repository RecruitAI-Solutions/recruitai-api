# File: .github/workflows/test.yml
# Mục đích: Tự động kiểm tra code khi push lên branch testing
# Chạy được NGAY, không cần VPS

name: 🧪 Testing Branch CI

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]

jobs:
  test:
    name: 🔍 Kiểm tra code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải code
        uses: actions/checkout@v4

      - name: ⚙️ Cài .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 📦 Restore packages
        run: dotnet restore RecruitAI-API.sln

      - name: 🔨 Build
        run: dotnet build RecruitAI-API.sln --configuration Release --no-restore

      - name: 🧪 Chạy Unit Tests
        run: |
          dotnet test tests/RecruitAI.UnitTests \
            --configuration Release \
            --logger "trx" \
            --results-directory ./TestResults

      - name: 🧪 Chạy Integration Tests
        run: |
          dotnet test tests/RecruitAI.IntegrationTests \
            --configuration Release \
            --logger "trx" \
            --results-directory ./TestResults

      - name: 📊 Upload kết quả test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults

      - name: ✅ Thông báo
        run: echo "✅ Testing branch passed all tests!"
