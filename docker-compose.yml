# File: docker-compose.yml
# Đặt tại thư mục gốc (api/)

networks:
  recruitai-network:
    driver: bridge

volumes:
  sql_data:
  api_logs:
  redis_data: 

services:
  # ===== SQL SERVER =====
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitai-sql-${ENVIRONMENT:-dev}
    networks:
      - recruitai-network
    env_file:
      - .env
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-DevPass@8386}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
    ports:
      - "${DB_PORT:-1434}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-DevPass@8386}" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: ${RESTART_POLICY:-no}

  # ===== REDIS CACHE =====
  redis:
    image: redis:7-alpine
    container_name: recruitai-redis-${ENVIRONMENT:-dev}
    networks:
      - recruitai-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: ${RESTART_POLICY:-no}
    env_file:
      - .env

  # ===== API BACKEND =====
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    image: ${DOCKER_IMAGE:-recruitai-api}:${TAG:-latest}
    container_name: recruitai-api-${ENVIRONMENT:-dev}
    networks:
      - recruitai-network
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HOSTINGSTARTUPASSEMBLIES: "Microsoft.AspNetCore.Mvc.Razor.RuntimeCompilation"

      # Database
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=${DB_NAME:-RecruitDev}${DB_SUFFIX:-};User Id=sa;Password=${DB_PASSWORD:-DevPass@8386};TrustServerCertificate=True;MultipleActiveResultSets=true"

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # JWT Configuration
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-15}

      # Social Login - Google
      Authentication__Google__ClientId: ${Google__ClientId}
      Authentication__Google__ClientSecret: ${Google__ClientSecret}

      # Social Login - Facebook
      Authentication__Facebook__AppId: ${Facebook__AppId}
      Authentication__Facebook__AppSecret: ${Facebook__AppSecret}

      # Social Login - Github
      Authentication__Github__ClientId: ${Github__ClientId}
      Authentication__Github__ClientSecret: ${Github__ClientSecret}

      # Vietmap Configuration (Geocoding)
      Vietmap__ApiKey: ${Vietmap__ApiKey}
      Vietmap__BaseUrl: ${Vietmap__BaseUrl}

      # Redis Configuration
      ConnectionStrings__Redis: redis:6379
      Redis__InstanceName: ${Redis__InstanceName:-RecruitAI}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - api_logs:/app/Logs
    restart: ${RESTART_POLICY:-no}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Cấu hình Docker Watch cho development
    develop:
      watch:
        # Theo dõi source code API
        - path: ./src/RecruitAI.API
          action: sync
          target: /src/RecruitAI.API
          ignore:
            - bin/
            - obj/
            - .vs/

        # Theo dõi source code Application
        - path: ./src/RecruitAI.Application
          action: sync
          target: /src/RecruitAI.Application
          ignore:
            - bin/
            - obj/

        # Theo dõi source code Domain
        - path: ./src/RecruitAI.Domain
          action: sync
          target: /src/RecruitAI.Domain
          ignore:
            - bin/
            - obj/

        # Theo dõi source code Infrastructure
        - path: ./src/RecruitAI.Infrastructure
          action: sync
          target: /src/RecruitAI.Infrastructure
          ignore:
            - bin/
            - obj/

        # Rebuild khi thay đổi file cấu hình
        - path: ./src/RecruitAI.API/Properties/launchSettings.json
          action: rebuild

        # Các file appsettings
        - path: ./src/RecruitAI.API/appsettings.json
          action: rebuild
        - path: ./src/RecruitAI.API/appsettings.Development.json
          action: rebuild

        # Các file project
        - path: ./src/RecruitAI.API/RecruitAI.API.csproj
          action: rebuild
        - path: ./src/RecruitAI.Application/RecruitAI.Application.csproj
          action: rebuild
        - path: ./src/RecruitAI.Domain/RecruitAI.Domain.csproj
          action: rebuild
        - path: ./src/RecruitAI.Infrastructure/RecruitAI.Infrastructure.csproj
          action: rebuild
      # ===== NGINX REVERSE PROXY =====
  nginx:
    image: nginx:alpine
    container_name: recruitai-nginx-${ENVIRONMENT:-dev}
    networks:
      - recruitai-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - api_logs:/var/log/nginx
    depends_on:
      - api
    restart: ${RESTART_POLICY:-unless-stopped}