# File: docker-compose.yml
# Đặt tại thư mục gốc (api/)

version: "3.9"

networks:
  recruitai-network:
    driver: bridge

volumes:
  sql_data:
  api_logs:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitai-sql-${ENVIRONMENT:-dev}
    networks:
      - recruitai-network
    environment:
      SA_PASSWORD: ${DB_PASSWORD:-DevPass@8386}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
    ports:
      - "${DB_PORT:-1434}:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-DevPass@8386}" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: ${RESTART_POLICY:-no}

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    image: ${DOCKER_IMAGE:-recruitai-api}:${TAG:-latest}
    container_name: recruitai-api-${ENVIRONMENT:-dev}
    networks:
      - recruitai-network
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=${DB_NAME:-RecruitDev}${DB_SUFFIX:-};User Id=sa;Password=${DB_PASSWORD:-DevPass@8386};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - ${MOUNT_SRC:-./src}:/src
      - api_logs:/app/Logs
      - /src/RecruitAI.API/bin
      - /src/RecruitAI.API/obj
      - /src/RecruitAI.Application/bin
      - /src/RecruitAI.Application/obj
      - /src/RecruitAI.Domain/bin
      - /src/RecruitAI.Domain/obj
      - /src/RecruitAI.Infrastructure/bin
      - /src/RecruitAI.Infrastructure/obj
    restart: ${RESTART_POLICY:-no}
