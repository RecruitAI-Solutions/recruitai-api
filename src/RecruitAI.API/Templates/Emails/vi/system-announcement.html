<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo hệ thống</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background-color: #6c757d;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }

        .announcement-box {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Thông báo hệ thống</h2>
        </div>
        <div class="content">
            <p>Xin chào <strong>{{UserName}}</strong>,</p>

            <div class="announcement-box">
                <p><strong>{{AnnouncementTitle}}</strong></p>
                <p>{{AnnouncementContent}}</p>
            </div>

            <p>Nếu có bất kỳ câu hỏi nào, vui lòng liên hệ bộ phận hỗ trợ.</p>

            <p>Trân trọng,<br>Đội ngũ RecruitAI</p>
        </div>
        <div class="footer">
            <p>&copy; {{Year}} RecruitAI. Tất cả quyền được bảo lưu.</p>
        </div>
    </div>
</body>
</html>
